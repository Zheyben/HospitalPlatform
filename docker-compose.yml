services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital_platform
      POSTGRES_USER: ${DATABASE_USERNAME:-hospital_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the local .env file}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - hospital_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  hospital_postgres_data:
