spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hospital_platform_test}
    username: ${DATABASE_USERNAME:hospital_app_test}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    org.springframework: WARN
    org.hibernate.SQL: WARN
