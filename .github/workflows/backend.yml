name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "database/**"
      - ".github/workflows/backend.yml"

  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "database/**"
      - ".github/workflows/backend.yml"

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run backend verification
        run: |
          chmod +x mvnw
          ./mvnw clean verify
