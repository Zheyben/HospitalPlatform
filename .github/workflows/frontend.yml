name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"

  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend structure
        run: |
          if [ -d "apps/frontend" ]; then
            echo "Frontend directory detected"
          else
            echo "Frontend directory not created yet"
          fi
